name: 新截圖推播到LINE群組

on:
  push:
    paths:
      - "screenshots/**"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: 找出這次 push 新增/修改的截圖檔案
        id: files
        run: |
          files=$(git -c core.quotepath=false diff --name-only HEAD~1 HEAD -- 'screenshots/*.jpg' 'screenshots/*.jpeg' 'screenshots/*.png' | tr '\n' '|')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "本次要推播的檔案: $files"

      - name: 決定推播對象（觸發關鍵字的群組，沒有就用預設的 LINE_USER_ID）
        id: target
        run: |
          # line_target.txt 由本機 listener 寫入：第一行是群組 ID、第二行是觸發時間。
          # 只有這次 push 有更新它才採用，否則（例如手動執行 daily_run.py）用預設對象
          if git diff --name-only HEAD~1 HEAD -- line_target.txt | grep -q .; then
            to=$(head -n1 line_target.txt | tr -d '\r\n ')
            # LINE 的 ID 格式：C/R/U 開頭 + 32 個 16 進位字元，不符合就不採用
            if echo "$to" | grep -Eq '^[CRU][0-9a-f]{32}$'; then
              echo "to=$to" >> "$GITHUB_OUTPUT"
              echo "推播到觸發的群組: $to"
            else
              echo "line_target.txt 格式不正確，改用預設對象"
            fi
          else
            echo "這次沒有指定推播對象，用預設的 LINE_USER_ID"
          fi

      - name: 等待圖片網址生效，合併推播圖片與等級文字到 LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ steps.target.outputs.to || secrets.LINE_USER_ID }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          IMAGE_URLS=""
          IFS='|' read -ra FILE_ARR <<< "$FILES"
          for f in "${FILE_ARR[@]}"; do
            [ -z "$f" ] && continue
            encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$f")
            # 用「commit SHA」而不是分支名稱組網址：同一個 SHA 底下的檔案內容永遠不變，
            # 不會像用分支名稱那樣，同檔名被覆蓋推送時撞到 CDN 快取抓到舊圖
            url="https://raw.githubusercontent.com/${REPO}/${SHA}/${encoded}"
            echo "等待網址生效: $url"
            curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null "$url"
            IMAGE_URLS+="$url"$'\n'
          done
          export IMAGE_URLS

          # 只有這次 push 有更新 heat_result.txt 才附上文字（結果第一行含時間，每次查詢都會不同），
          # 避免只有截圖、沒有重新查詢等級時，把舊的結果再推一次
          if git diff --name-only HEAD~1 HEAD -- heat_result.txt | grep -q .; then
            export TEXT_FILE=heat_result.txt
          else
            echo "這次沒有更新 heat_result.txt，不附上文字"
          fi

          # 每次 push 最多 5 則（LINE 額度以 push 次數 × 人數計算），7 張圖 + 文字 = 2 次
          python send_line_batch.py
