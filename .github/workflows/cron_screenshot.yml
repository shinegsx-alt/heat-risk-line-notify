name: Scheduled Web Screenshot to LINE

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 🟢 關鍵修正：直接指定微軟官方 Playwright 容器（已內建所有瀏覽器與相依環境）
    container:
      image: ://microsoft.com

    steps:
    - name: 複製專案原始碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝 Python 依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 🟢 修正：因為 Docker 容器內已經有完整環境，只要單純下載 chromium 即可（免去 --with-deps）
    - name: 安裝 Playwright 瀏覽器核心
      run: |
        python -m playwright install chromium

    - name: 執行截圖發送腳本
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_TO_ID: ${{ secrets.LINE_TO_ID }}
      run: python script.py
