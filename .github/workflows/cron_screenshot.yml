name: Scheduled Web Screenshot to LINE

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch: # 允許手動點擊按鈕立即測試執行

jobs:
  run-bot:
    # 🟢 修正關鍵：將 ubuntu-latest 改為指定 ubuntu-22.04
    runs-on: ubuntu-22.04

    steps:
    - name: 複製專案原始碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝 Python 依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 🟢 修正：在穩定的 22.04 環境下，直接安全地安裝系統依賴與瀏覽器
    - name: 安裝 Playwright 瀏覽器核心
      run: |
        python -m playwright install chromium --with-deps

    - name: 執行截圖發送腳本
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_TO_ID: ${{ secrets.LINE_TO_ID }}
      run: python script.py
