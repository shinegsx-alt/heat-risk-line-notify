name: 熱危害風險等級通知

on:
  schedule:
    # GitHub Actions 的排程時間是 UTC，台灣時間 = UTC + 8
    # 下面範例是台灣時間每天 10:00 與 14:00 各跑一次（UTC 02:00 / 06:00）
    # 依需求自行增減、調整時間，語法: https://crontab.guru/
    - cron: "0 2 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動點擊執行，方便測試

permissions:
  contents: write   # 需要寫入權限才能把截圖 commit 回 repo

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 查詢並截圖熱危害風險等級
        id: capture
        env:
          HEAT_ADDRESS: ${{ vars.HEAT_ADDRESS }}
        run: python capture_screenshot.py

      - name: 只保留最近 30 張截圖，避免 repo 無限膨脹
        run: |
          cd screenshots
          ls -t | tail -n +31 | xargs -r rm -f

      - name: Commit 並 push 截圖
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "更新熱危害風險等級截圖 ${{ steps.capture.outputs.path }}" || echo "無變更可 commit"
          git push

      - name: 等待截圖網址在 GitHub 上生效
        env:
          IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.capture.outputs.path }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null "$IMAGE_URL"

      - name: 用 LINE 推播圖片
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.capture.outputs.path }}
        run: python send_line_image.py
